name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  Check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format 💅
        run: pnpm format:check

      - name: Check 🔎
        run: pnpm check

      - name: Test 🧪
        run: pnpm test
